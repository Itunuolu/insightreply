<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>InsightReply API</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #07111f;
        color: #e7eef8;
      }
      main {
        width: min(38rem, calc(100% - 3rem));
        padding: 3rem 0;
      }
      .mark {
        color: #67e8f9;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.78rem;
      }
      h1 {
        margin: 0.75rem 0;
        font-size: clamp(2rem, 7vw, 4rem);
        letter-spacing: -0.04em;
      }
      p {
        color: #a8b6c8;
        line-height: 1.65;
      }
      nav {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
        flex-wrap: wrap;
      }
      a {
        color: #07111f;
        background: #67e8f9;
        padding: 0.7rem 1rem;
        border-radius: 0.6rem;
        font-weight: 700;
        text-decoration: none;
      }
      a.secondary {
        color: #dbeafe;
        background: #17253a;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Hadesh.ai</div>
      <h1>InsightReply</h1>
      <p>
        Production API for the InsightReply Chrome extension. InsightReply generates draft comments
        and replies for LinkedIn conversations selected by the user; it never publishes them
        automatically.
      </p>
      <nav>
        <a href="/health">Service status</a>
        <a class="secondary" href="/privacy-policy/">Privacy policy</a>
      </nav>
    </main>
  </body>
</html>
